name: CI - Windows

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.head_ref != '' }}

jobs:
  build:
    runs-on: windows-2022

    permissions:
      actions: write

    strategy:
      matrix:
        platform: [x64]

        include:
          - platform: x64
            arch: x64
            qt_arch: win64_msvc2019_64

    steps:

      # ----------------------------------------------------------------------
      # Source
      # ----------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true

      # ----------------------------------------------------------------------
      # MSVC
      # ----------------------------------------------------------------------

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      # ----------------------------------------------------------------------
      # Python 3.11
      #
      # This replaces the old vcpkg Python 3.11 package.
      # setup-python supplies:
      #
      #   python.exe
      #   python311.dll
      #   Include/
      #   Lib/
      #   libs/python311.lib
      #
      # CMake deploys python311.dll into the final application directory.
      # ----------------------------------------------------------------------

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python --version
          python -m pip --version
          python -m pip install --upgrade pip
          python -m pip install pybind11

      - name: Verify Python development files
        shell: pwsh
        run: |
          Write-Host "Python:"
          python --version

          Write-Host ""
          Write-Host "Python executable:"
          python -c "import sys; print(sys.executable)"

          Write-Host ""
          Write-Host "Python prefix:"
          python -c "import sys; print(sys.prefix)"

          Write-Host ""
          Write-Host "pybind11 CMake directory:"
          python -m pybind11 --cmakedir

      # ----------------------------------------------------------------------
      # Ninja
      # ----------------------------------------------------------------------

      - name: Install build tools
        shell: pwsh
        run: |
          if ((Get-Command "ninja.exe" -ErrorAction SilentlyContinue) -eq $null) {
            choco install ninja --no-progress -y
          }

          ninja --version

      # ----------------------------------------------------------------------
      # Qt
      # ----------------------------------------------------------------------

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.15.2"
          arch: ${{ matrix.qt_arch }}
          archives: qtbase qtquickcontrols2 qtdeclarative qttools d3dcompiler_47
          cache: true

      # ----------------------------------------------------------------------
      # Configure / build / install
      #
      # No vcpkg toolchain is supplied here.
      #
      # CMake therefore enters the non-vcpkg deployment path:
      #
      #   - Python DLL is installed explicitly
      #   - MSVC/UCRT runtime is installed
      #   - windeployqt deploys Qt
      #
      # pybind11 is found through the CMake directory installed by pip.
      # ----------------------------------------------------------------------

      - name: Configure luster-ko
        shell: pwsh
        run: |
          $pybind11CMakeDir = python -m pybind11 --cmakedir

          Write-Host "pybind11 CMake directory:"
          Write-Host $pybind11CMakeDir

          cmake `
            -B build `
            -G "Visual Studio 17 2022" `
            -A ${{ matrix.arch }} `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            -DCMAKE_PREFIX_PATH="$pybind11CMakeDir" `
            -DMSVC_RUNTIME_DYNAMIC=ON `
            -DVERBOSE_CONFIGURE=ON

      - name: Build luster-ko
        shell: pwsh
        run: |
          cmake --build build --config RelWithDebInfo --parallel

      - name: Install luster-ko
        shell: pwsh
        run: |
          cmake --install build --config RelWithDebInfo

      # ----------------------------------------------------------------------
      # Basic deployment verification
      # ----------------------------------------------------------------------

      - name: Verify deployed application
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "build\bin\luster-ko.exe"

          if (!(Test-Path $exe)) {
            throw "Application was not installed: $exe"
          }

          Write-Host ""
          Write-Host "Installed application:"
          Write-Host $exe

          Write-Host ""
          Write-Host "Installed files:"
          Get-ChildItem -Path (Split-Path $exe) -Recurse |
            Select-Object FullName, Length

          $pythonDll = Get-ChildItem `
            -Path (Split-Path $exe) `
            -Filter "python*.dll" `
            -File `
            -ErrorAction SilentlyContinue

          if (!$pythonDll) {
            throw "No Python runtime DLL was deployed next to luster-ko.exe."
          }

          Write-Host ""
          Write-Host "Python runtime DLL(s):"
          $pythonDll | Select-Object FullName, Length

      # ----------------------------------------------------------------------
      # Artifact
      # ----------------------------------------------------------------------

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.platform }}
          path: ./build/bin
