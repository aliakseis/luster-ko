name: CI - Windows

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.head_ref != '' }}

jobs:
  build:
    runs-on: windows-2022

    permissions:
      actions: write

    strategy:
      matrix:
        platform: [x64]

        include:
          - platform: x64
            arch: x64
            qt_arch: win64_msvc2019_64

    steps:

      # ----------------------------------------------------------------------
      # Source
      # ----------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true

      # ----------------------------------------------------------------------
      # MSVC
      # ----------------------------------------------------------------------

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      # ----------------------------------------------------------------------
      # Python 3.11
      #
      # Keep the exact Python installation selected by setup-python.
      #
      # Some later actions can modify the global Python environment/PATH.
      # Therefore we must NOT rely on "python" after those actions.
      # ----------------------------------------------------------------------

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"

      - name: Save Python 3.11 environment
        shell: pwsh
        run: |
          $pythonHome = python -c "import sys; print(sys.prefix)"
          $pythonExe  = python -c "import sys; print(sys.executable)"

          Write-Host "Python home:"
          Write-Host $pythonHome

          Write-Host "Python executable:"
          Write-Host $pythonExe

          if (!(Test-Path $pythonExe)) {
            throw "Python executable does not exist: $pythonExe"
          }

          # Keep this in a custom variable. The Qt action may modify
          # pythonLocation/Python_ROOT_DIR later.
          "LUSTER_PYTHON_HOME=$pythonHome" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          "LUSTER_PYTHON_EXE=$pythonExe" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          & "$env:LUSTER_PYTHON_EXE" --version
          & "$env:LUSTER_PYTHON_EXE" -m pip --version

          & "$env:LUSTER_PYTHON_EXE" -m pip install --upgrade pip
          & "$env:LUSTER_PYTHON_EXE" -m pip install pybind11

      - name: Verify Python development files
        shell: pwsh
        run: |
          Write-Host "Python executable:"
          Write-Host $env:LUSTER_PYTHON_EXE

          Write-Host ""
          Write-Host "Python version:"
          & "$env:LUSTER_PYTHON_EXE" --version

          Write-Host ""
          Write-Host "Python prefix:"
          & "$env:LUSTER_PYTHON_EXE" -c "import sys; print(sys.prefix)"

          Write-Host ""
          Write-Host "pybind11 CMake directory:"
          $pybind11CMakeDir = & "$env:LUSTER_PYTHON_EXE" -m pybind11 --cmakedir
          Write-Host $pybind11CMakeDir

          if (!(Test-Path $pybind11CMakeDir)) {
            throw "pybind11 CMake directory does not exist: $pybind11CMakeDir"
          }

          "LUSTER_PYBIND11_CMAKE_DIR=$pybind11CMakeDir" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      # ----------------------------------------------------------------------
      # Ninja
      # ----------------------------------------------------------------------

      - name: Install build tools
        shell: pwsh
        run: |
          if ((Get-Command "ninja.exe" -ErrorAction SilentlyContinue) -eq $null) {
            choco install ninja --no-progress -y
          }

          ninja --version

      # ----------------------------------------------------------------------
      # Qt
      # ----------------------------------------------------------------------

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.15.2"
          arch: ${{ matrix.qt_arch }}
          archives: qtbase qtquickcontrols2 qtdeclarative qttools d3dcompiler_47
          cache: true

      # ----------------------------------------------------------------------
      # Verify that Qt did not change the Python installation we intend to use.
      #
      # Do not use "python" here. The Qt action may have changed it.
      # ----------------------------------------------------------------------

      - name: Verify pinned Python after Qt setup
        shell: pwsh
        run: |
          Write-Host "Pinned Python executable:"
          Write-Host $env:LUSTER_PYTHON_EXE

          Write-Host ""
          Write-Host "Pinned Python version:"
          & "$env:LUSTER_PYTHON_EXE" --version

          Write-Host ""
          Write-Host "Pinned Python prefix:"
          & "$env:LUSTER_PYTHON_EXE" -c "import sys; print(sys.prefix)"

          Write-Host ""
          Write-Host "Pinned Python pybind11:"
          & "$env:LUSTER_PYTHON_EXE" -m pybind11 --cmakedir

          if ($LASTEXITCODE -ne 0) {
            throw "pybind11 is not available in the pinned Python 3.11 environment."
          }

      # ----------------------------------------------------------------------
      # Configure / build / install
      #
      # No vcpkg toolchain is supplied here.
      #
      # Python is explicitly pinned to the Python installation selected by
      # setup-python, regardless of changes made by install-qt-action.
      # ----------------------------------------------------------------------

      - name: Configure luster-ko
        shell: pwsh
        run: |
          $pythonExe = $env:LUSTER_PYTHON_EXE
          $pythonHome = $env:LUSTER_PYTHON_HOME
          $pybind11CMakeDir = $env:LUSTER_PYBIND11_CMAKE_DIR

          Write-Host "========================================"
          Write-Host "Python configuration"
          Write-Host "========================================"
          Write-Host "Python home:"
          Write-Host $pythonHome

          Write-Host ""
          Write-Host "Python executable:"
          Write-Host $pythonExe

          Write-Host ""
          Write-Host "Python version:"
          & $pythonExe --version

          Write-Host ""
          Write-Host "pybind11 CMake directory:"
          Write-Host $pybind11CMakeDir

          if (!(Test-Path $pythonExe)) {
            throw "Python executable not found: $pythonExe"
          }

          if (!(Test-Path $pybind11CMakeDir)) {
            throw "pybind11 CMake directory not found: $pybind11CMakeDir"
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "CMake configure"
          Write-Host "========================================"

          cmake `
            -B build `
            -G "Visual Studio 17 2022" `
            -A ${{ matrix.arch }} `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            -DCMAKE_PREFIX_PATH="$pybind11CMakeDir" `
            -DPython3_EXECUTABLE="$pythonExe" `
            -DPython3_ROOT_DIR="$pythonHome" `
            -DMSVC_RUNTIME_DYNAMIC=ON `
            -DVERBOSE_CONFIGURE=ON

      - name: Build luster-ko
        shell: pwsh
        run: |
          cmake --build build --config RelWithDebInfo --parallel

      - name: Install luster-ko
        shell: pwsh
        run: |
          cmake --install build --config RelWithDebInfo

      # ----------------------------------------------------------------------
      # Basic deployment verification
      # ----------------------------------------------------------------------

      - name: Verify deployed application
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "build\bin\luster-ko.exe"

          if (!(Test-Path $exe)) {
            throw "Application was not installed: $exe"
          }

          Write-Host ""
          Write-Host "Installed application:"
          Write-Host $exe

          Write-Host ""
          Write-Host "Installed files:"
          Get-ChildItem -Path (Split-Path $exe) -Recurse |
            Select-Object FullName, Length

          $pythonDll = Get-ChildItem `
            -Path (Split-Path $exe) `
            -Filter "python*.dll" `
            -File `
            -ErrorAction SilentlyContinue

          if (!$pythonDll) {
            throw "No Python runtime DLL was deployed next to luster-ko.exe."
          }

          Write-Host ""
          Write-Host "Python runtime DLL(s):"
          $pythonDll | Select-Object FullName, Length

      # ----------------------------------------------------------------------
      # Artifact
      # ----------------------------------------------------------------------

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.platform }}
          path: ./build/bin
